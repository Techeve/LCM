# Written by the lcm-agent package.
#
# needrestart must not restart the agent after a package upgrade: it switches to
# the new binary by itself once it is idle (exec, same PID), and a restart from
# outside would end a running LCM command or the apt run that installs the update.
# 0 = never restart this service (the regex is matched against the service name,
# e.g. lcm-agent.service).
$nrconf{override_rc}{qr(^lcm-agent)} = 0;
