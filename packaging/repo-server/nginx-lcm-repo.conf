# nginx configuration for repo.techeve.de - the TechEve package repository
# with three channels (beta + community + enterprise).
#
# This file is NOT installed by any package. It is deployed by hand on the
# repository server, see packaging/repo-server/README.md.
#
# Channel layout - all channels are served by ONE aptly instance, each fed by
# the CI from its branch (beta / community / enterprise):
#
#   /                     community channel (public, no credentials)
#                         -> deb https://repo.techeve.de stable main
#                         beta channel: same public root, own suite
#                         -> deb https://repo.techeve.de beta main
#
#   /enterprise/          enterprise channel (subscription key required)
#                         own builds from the enterprise maintenance branch
#                         -> deb https://repo.techeve.de/enterprise stable main
#
#   /api/                 aptly HTTP API - CI credentials ONLY, never customers
#
# Why a path prefix and not a separate suite on the same prefix: aptly gives
# every publish prefix its OWN pool directory. Protecting /enterprise/ therefore
# protects the metadata AND the .deb files. If both channels shared one prefix
# and differed only by distribution, the pool would be shared and world
# readable - anyone could download the enterprise packages directly from
# /pool/... without ever touching the protected metadata.

# Plain HTTP: redirect only. Basic authentication sends the subscription key
# base64 encoded but unencrypted, so the enterprise channel must never be
# reachable over http://.
server {
    listen      80;
    listen      [::]:80;
    server_name repo.techeve.de;

    # Let's Encrypt renewal stays on HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name repo.techeve.de;

    ssl_certificate     /etc/letsencrypt/live/repo.techeve.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repo.techeve.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # aptly's published tree. Adjust to the aptly rootDir on this host
    # (`aptly config show` -> "rootDir", plus "/public").
    root /var/lib/aptly/public;

    server_tokens off;
    charset       utf-8;

    # Directory listings are off on purpose: apt only ever requests concrete
    # files, and a listing would advertise which versions exist.
    autoindex off;

    access_log /var/log/nginx/repo.access.log;
    error_log  /var/log/nginx/repo.error.log;

    # ---- 1. Enterprise channel -------------------------------------------
    #
    # "^~" makes this a non-regex prefix match that wins over any regex
    # location, and it deliberately has NO trailing slash so that a request to
    # /enterprise (which nginx would otherwise hand to "location /") is covered
    # as well.
    location ^~ /enterprise {
        auth_basic           "LCM Enterprise Repository";
        auth_basic_user_file /etc/lcm-repo/enterprise.htpasswd;

        # Managed by packaging/repo-server/lcm-subscriptions. Expired keys are
        # removed from that file by the daily sync, so an expired subscription
        # stops working at the next `apt update`.

        try_files $uri $uri/ =404;
    }

    # ---- 2. aptly HTTP API -----------------------------------------------
    #
    # The API can publish AND delete. It must therefore use a separate
    # credentials file from the customer keys - a subscription key must never
    # be able to reach it.
    location ^~ /api {
        auth_basic           "aptly API";
        auth_basic_user_file /etc/lcm-repo/api.htpasswd;

        # Second gate: only the CI runner may talk to the API at all. Replace
        # with the runner's address; drop both lines if the runner has no
        # static IP (the credentials still apply).
        # allow 203.0.113.10;
        # deny  all;

        proxy_pass       http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Package uploads are large and signing a publish takes a while.
        client_max_body_size 512m;
        proxy_read_timeout   600s;
    }

    # ---- 3. Community channel + static files ------------------------------
    #
    # Everything else is public: dists/, pool/, the signing key and the
    # setup scripts.
    location / {
        try_files $uri $uri/ =404;
    }

    # aptly keeps its database next to the published tree on some setups.
    # Refuse dotfiles either way.
    location ~ /\. {
        deny all;
    }
}
