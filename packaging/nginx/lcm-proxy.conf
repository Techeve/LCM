# Kopfzeilen fuer jede Weiterleitung an LCM (include in lcm.conf).
# Ablage: /etc/nginx/snippets/lcm-proxy.conf
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# LCM spricht intern HTTPS mit Selbstsignat; die Strecke laeuft ueber Loopback.
proxy_ssl_verify   off;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
# Verbindungsaufbau zum Backend: knapp - es ist derselbe Rechner.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
