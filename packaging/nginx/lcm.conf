# nginx als Reverse-Proxy vor der LCM-Weboberflaeche (Port 9310).
#
# Ablage: /etc/nginx/sites-available/lcm.conf, dann
#   ln -s /etc/nginx/sites-available/lcm.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Dazu in /etc/lcm/config.json:
#   "trust_proxy_header": true,
#   "trusted_proxies": ["127.0.0.1", "::1"]
# und unter Einstellungen -> Allgemein: public_base_url = https://lcm.example.com
#
# Was der Proxy hier leistet - jeweils ZUSAETZLICH zu dem, was LCM selbst tut:
#   - TLS mit echtem Zertifikat, nur TLS 1.2/1.3
#   - Anmelde-Bremse ueber ALLE Quellen (LCM zaehlt je Prozess)
#   - Rumpf-Grenzen je Pfad (1 MiB, 64 MiB nur fuer den Backup-Upload)
#   - Zeitgrenzen gegen langsame Clients (Slowloris) - kurz fuer die API,
#     lang nur fuer Konsole und Log-Strom
#   - Health-Endpunkt nur aus dem eigenen Netz (Monitoring), nicht oeffentlich
#   - Agent-Download nur aus dem eigenen Netz (Server holen ihn beim Einrichten)
#
# Der Agent-Port 9320 gehoert NICHT hierher: TCP-Passthrough im stream-Block,
# siehe docs/guides/remote.md.

# Anmelde-Bremse: 10 Anfragen pro Minute und Quelle auf den anonymen Pfaden.
limit_req_zone $binary_remote_addr zone=lcm_auth:10m rate=10r/m;
# Allgemeine Bremse gegen Massenabfragen: 30 Anfragen/s je Quelle mit Reserve.
limit_req_zone $binary_remote_addr zone=lcm_api:10m rate=30r/s;
# Gleichzeitige Verbindungen je Quelle.
limit_conn_zone $binary_remote_addr zone=lcm_conn:10m;

# Wer Health und Agent-Download sehen darf: eigenes Netz und Monitoring.
geo $lcm_internal {
    default        0;
    127.0.0.1      1;
    ::1            1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

# HTTP -> HTTPS. Sonst nichts auf Port 80.
server {
    listen 80;
    listen [::]:80;
    server_name lcm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lcm.example.com;

    ssl_certificate     /etc/letsencrypt/live/lcm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lcm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:lcm_ssl:10m;
    ssl_session_tickets off;

    # LCM sendet HSTS, CSP und die uebrigen Sicherheits-Kopfzeilen selbst -
    # der Proxy reicht sie nur durch und fuegt nichts ein (die CSP wuerde
    # eingefuegte Skripte ohnehin blockieren).
    server_tokens off;

    # Vorgaben fuer alles: kleine Ruempfe, kurze Fristen.
    client_max_body_size      1m;
    client_body_timeout       15s;
    client_header_timeout     15s;
    send_timeout              30s;
    keepalive_timeout         65s;
    limit_conn lcm_conn       40;
    limit_req  zone=lcm_api burst=60 nodelay;
    limit_req_status          429;
    limit_conn_status         429;

    # Health: nur Monitoring aus dem eigenen Netz. Von aussen 404 statt 403 -
    # kein Hinweis darauf, dass es den Pfad gibt.
    location = /api/v1/health {
        if ($lcm_internal = 0) { return 404; }
        proxy_pass https://127.0.0.1:9310;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Agent-Binary: nur aus dem eigenen Netz (die Server holen es beim
    # Einrichten). Grosse Antwort, deshalb ohne Puffern.
    location ^~ /api/v1/agent/download/ {
        if ($lcm_internal = 0) { return 404; }
        proxy_pass https://127.0.0.1:9310;
        proxy_buffering off;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Anmeldung, zweiter Faktor, Passwort-Reset, Aktivierungslinks: gebremst.
    location ~ ^/api/v1/(auth/|users/activation-links/consume) {
        limit_req zone=lcm_auth burst=10 nodelay;
        proxy_pass https://127.0.0.1:9310;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Backup-Upload: der einzige grosse Rumpf, nicht puffern (LCM streamt).
    location = /api/v1/system/backups/restore-upload {
        client_max_body_size    64m;
        client_body_timeout     120s;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_pass https://127.0.0.1:9310;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Backup-Download: grosse Antwort, ohne Puffern.
    location ~ ^/api/v1/system/backups/[^/]+/download$ {
        proxy_buffering    off;
        proxy_read_timeout 300s;
        send_timeout       300s;
        proxy_pass https://127.0.0.1:9310;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Web-Konsole (WebSocket): die Sitzung bleibt offen.
    location ~ ^/api/v1/servers/[0-9]+/terminal$ {
        proxy_pass https://127.0.0.1:9310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Live-Protokoll (Server-Sent Events): nicht puffern, lange Frist.
    location = /api/v1/system/logs/stream {
        proxy_pass https://127.0.0.1:9310;
        proxy_buffering    off;
        proxy_read_timeout 1800s;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Lange laufende Aktionen (Onboarding, Haertung, Reconnect) antworten
    # synchron - hier grosszuegiger als die API-Vorgabe.
    location ~ ^/api/v1/servers/(join|probe|[0-9]+/(reconnect|harden-ssh|unharden-ssh|restrict-sudo|rotate-key|decommission|ssh-port|ssh-root-login|dns|ntp|repositories/))$ {
        proxy_read_timeout 900s;
        proxy_pass https://127.0.0.1:9310;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }

    # Alles Uebrige: API und Oberflaeche.
    location / {
        proxy_read_timeout 60s;
        proxy_pass https://127.0.0.1:9310;
        include /etc/nginx/snippets/lcm-proxy.conf;
    }
}
