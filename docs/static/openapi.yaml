        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/auth/2fa/setup:
    post:
      tags:
      - Auth
      summary: Setup T O T P
      operationId: authCtrl_SetupTOTP
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 'Erster Schritt: Prüft Credentials.'
      operationId: authCtrl_Login
      description: 'Erster Schritt: Prüft Credentials. Hat der User 2FA aktiviert, wird KEIN reguläres
        Token ausgegeben, sondern eine Challenge - der zweite Schritt (/auth/login/2fa) verifiziert den
        TOTP-Code.


        Öffentlicher Endpunkt (keine Authentifizierung nötig).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      security: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/auth/login/2fa:
    post:
      tags:
      - Auth
      summary: 'Zweiter Schritt: Verifiziert den TOTP-Code gegen die Challenge und liefert das finale
        JWT.'
      operationId: authCtrl_LoginTOTP
      description: 'Zweiter Schritt: Verifiziert den TOTP-Code gegen die Challenge und liefert das finale
        JWT.


        Öffentlicher Endpunkt (keine Authentifizierung nötig).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge:
                  type: string
                code:
                  type: string
      security: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: JWTs sind zustandslos; der Client verwirft das Token.
      operationId: authCtrl_Logout
      description: JWTs sind zustandslos; der Client verwirft das Token. Der Endpunkt existiert für ein
        konsistentes API und künftige Token-Sperrlisten.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
