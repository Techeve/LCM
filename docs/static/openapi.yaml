openapi: 3.0.3
info:
  title: LCM REST API
  version: 1.29.0
  description: 'Die vollständige REST-API des LCM-Backends (Go/Fiber). Das Web-Frontend nutzt exakt diese
    Endpunkte - es gibt keine separate interne API.


    **Authentifizierung** (zwei gleichwertige Wege, siehe Sicherheitsschemas):

    - `Authorization: Bearer <jwt>` - Browser-/User-Sessions, ausgestellt von `POST /auth/login` (bzw.
    `/auth/login/2fa` bei aktivierter 2FA).

    - `X-API-Key: <key>` - Service-zu-Service-Zugriff mit einem unter *Einstellungen → API-Keys* erzeugten,
    auf Scopes eingeschränkten Schlüssel.


    Berechtigungen werden pro Endpunkt per RBAC-Scope geprüft (in der Beschreibung als `bereich:read`/`bereich:write`
    vermerkt); die sichtbaren Daten werden bei Servern zusätzlich auf die Gruppen des jeweiligen Benutzers
    eingeschränkt.


    Diese Referenz ist automatisch aus den Routen- und Handler-Definitionen des Quellcodes erzeugt (`internal/api/router/router.go`
    + Controller) - Pfade, Methoden und Berechtigungen sind exakt der aktuelle Stand. Nicht jeder Endpunkt
    hat ein vollständig dokumentiertes Response-Schema; die tatsächliche Antwort richtet sich nach dem
    jeweiligen Domain-Modell (siehe Architektur).'
servers:
- url: /api/v1
  description: Relativ zur LCM-Instanz, z. B. https://lcm.example.com/api/v1
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session-Token aus POST /auth/login.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Service-API-Key aus Einstellungen → API-Keys.
tags:
- name: API-Keys
- name: Alarme
- name: Alarmregeln
- name: Anwendungen
- name: Auth
- name: Benachrichtigungskanäle
- name: Benutzer (LCM-Login)
- name: Berechtigungsprofile
- name: Custom-Aktionen
- name: Docker (global)
- name: Einstellungen
- name: Jobs & Audit
- name: Linux-Benutzer
- name: Pakete (global)
- name: Regeln
- name: Rollen
- name: SSH-Sitzungen
- name: Server
- name: Server-Benutzer
- name: Servergruppen
- name: Sicherheit (global)
- name: System
- name: Zeitpläne
paths:
  /api/v1/agent/download/{arch}:
    get:
      tags:
      - System
      summary: lcm-agent-Binary herunterladen (LCM Remote).
      operationId: controllers_AgentDownload
      description: 'Liefert das lcm-agent-Binary für die manuelle Installation auf
        einem Server, der sich AUSGEHEND verbinden soll (NAT/Roaming).


        Bewusst ÖFFENTLICH - kein Login nötig und von der IP-Allowlist
        ausgenommen: Das Binary ist ein veröffentlichtes Artefakt ohne
        Geheimnisse, und der Zielserver hat beim Einrichten noch gar keine
        Zugangsdaten. Das Geheimnis ist das Enrollment-Token, nicht das Binary.


        Keine Berechtigung nötig.'
      parameters:
      - name: arch
        in: path
        required: true
        description: Zielarchitektur.
        schema:
          type: string
          enum:
          - amd64
          - arm64
      security: []
      responses:
        '200':
          description: Binary.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Für diese Architektur liegt kein Binary vor.
  /api/v1/alert-events:
    get:
      tags:
      - Alarme
      summary: Events
      operationId: alertCtrl_Events
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Benötigte Berechtigung: `alerts:manage`.'
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/alert-rules:
    get:
      tags:
      - Alarmregeln
      summary: List
      operationId: alertCtrl_List
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Benötigte Berechtigung: `alerts:manage`.'
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
    post:
      tags:
      - Alarmregeln
      summary: Create
      operationId: alertCtrl_Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                enabled:
                  type: boolean
                group_ids:
                  type: array
                  items:
                    type: integer
                channel_id:
                  type: string
                severity:
                  type: string
                threshold_percent:
                  type: integer
                forecast_days:
                  type: integer
                max_outdated:
                  type: integer
                min_severity:
                  type: string
                heartbeat_hours:
                  type: integer
                cooldown_minutes:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Benötigte Berechtigung: `alerts:manage`.'
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/alert-rules/{id}:
    patch:
      tags:
      - Alarmregeln
      summary: Update
      operationId: alertCtrl_Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                enabled:
                  type: boolean
                group_ids:
                  type: array
                  items:
                    type: integer
                channel_id:
                  type: string
                severity:
                  type: string
                threshold_percent:
                  type: integer
                forecast_days:
                  type: integer
                max_outdated:
                  type: integer
                min_severity:
                  type: string
                heartbeat_hours:
                  type: integer
                cooldown_minutes:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Benötigte Berechtigung: `alerts:manage`.'
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
    delete:
      tags:
      - Alarmregeln
      summary: Delete
      operationId: alertCtrl_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Benötigte Berechtigung: `alerts:manage`.'
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/alerts/evaluate:
    post:
      tags:
      - Alarme
      summary: Löst eine sofortige Auswertung aller Alarm-Regeln aus.
      operationId: alertCtrl_Evaluate
      description: 'Löst eine sofortige Auswertung aller Alarm-Regeln aus.


        Benötigte Berechtigung: `alerts:manage`.'
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/apikeys:
    get:
      tags:
      - API-Keys
      summary: List
      operationId: apiKeyCtrl_List
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Benötigte Berechtigung: `apikeys:manage`.'
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
    post:
      tags:
      - API-Keys
      summary: Der Klartext-Key ist NUR in dieser Response enthalten.
      operationId: apiKeyCtrl_Create
      description: 'Der Klartext-Key ist NUR in dieser Response enthalten.


        Benötigte Berechtigung: `apikeys:manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                expires_in_days:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/apikeys/{id}:
    delete:
      tags:
      - API-Keys
      summary: Revoke
      operationId: apiKeyCtrl_Revoke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: >-
        Zweistufig: der erste Aufruf WIDERRUFT den Key (sofort ungültig, der
        Eintrag bleibt mit revoked=true als Historie sichtbar); ein zweiter
        Aufruf auf dem bereits widerrufenen Key entfernt ihn endgültig.


        Benötigte Berechtigung: `apikeys:manage`.
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/apps:
    get:
      tags:
      - Anwendungen
      summary: 'Anwendungskatalog: Steckbriefe der Software neben der Paketverwaltung.'
      operationId: appCtrl_ListApps
      description: 'Liefert alle Katalogeintraege, mitgelieferte zuerst. Jeder Eintrag beschreibt, woran eine Anwendung erkannt wird, wie ihre Version zu ermitteln ist und wo die neueste steht.

        

        

        Benötigte Berechtigung: `settings:manage`.'
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
    post:
      tags:
      - Anwendungen
      summary: Eigenen Katalogeintrag anlegen.
      operationId: appCtrl_CreateApp
      description: 'Legt einen eigenen Eintrag an. Mindestens ein Merkmal ist erforderlich; Merkmale duerfen keine Sonderzeichen enthalten, weil sie beim Scan in eine Kommandozeile eingesetzt werden.

        

        

        Benötigte Berechtigung: `settings:manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                markers:
                  type: string
                  description: Eine Merkmal-Zeile je Zeile, "art wert" (path|unit|bin|proc).
                version_command:
                  type: string
                  description: 'Der Platzhalter {path} wird durch den Fundort ersetzt.'
                version_pattern:
                  type: string
                compare:
                  type: string
                  enum: [semver, exact, none]
                latest_source:
                  type: string
                  description: 'github:owner/repo oder url:https://…'
                latest_pattern:
                  type: string
                backup_action_id:
                  type: integer
                update_action_id:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/apps/{id}:
    delete:
      tags:
      - Anwendungen
      summary: Eigenen Katalogeintrag entfernen.
      operationId: appCtrl_DeleteApp
      description: 'Entfernt einen selbst angelegten Eintrag samt der Funde, die auf ihn zeigen. Mitgelieferte Eintraege lassen sich abschalten, aber nicht loeschen (403).

        

        

        Benötigte Berechtigung: `settings:manage`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
    put:
      tags:
      - Anwendungen
      summary: Katalogeintrag aendern.
      operationId: appCtrl_UpdateApp
      description: 'Aendert einen Eintrag. Bei mitgelieferten Eintraegen werden die Erkennungsfelder beim naechsten Start wieder auf den Auslieferungsstand gesetzt; Schalter und Aktions-Verweise bleiben erhalten.

        

        

        Benötigte Berechtigung: `settings:manage`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                markers:
                  type: string
                  description: Eine Merkmal-Zeile je Zeile, "art wert" (path|unit|bin|proc).
                version_command:
                  type: string
                  description: 'Der Platzhalter {path} wird durch den Fundort ersetzt.'
                version_pattern:
                  type: string
                compare:
                  type: string
                  enum: [semver, exact, none]
                latest_source:
                  type: string
                  description: 'github:owner/repo oder url:https://…'
                latest_pattern:
                  type: string
                backup_action_id:
                  type: integer
                update_action_id:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/audit:
