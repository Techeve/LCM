      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Pin-Sicht.
          content:
            application/json:
              schema:
                type: object
                properties:
                  global:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        server_id:
                          type: integer
                          description: 0 = global (gilt für alle Server).
                        name:
                          type: string
                        no_remove:
                          type: boolean
                        hold:
                          type: boolean
                        note:
                          type: string
                  server:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        server_id:
                          type: integer
                          description: 0 = global (gilt für alle Server).
                        name:
                          type: string
                        no_remove:
                          type: boolean
                        hold:
                          type: boolean
                        note:
                          type: string
                  available:
                    type: boolean
                  reason:
                    type: string
                  package_manager:
                    type: string
                  kernel_preset:
                    type: array
                    items:
                      type: string
        '401':
