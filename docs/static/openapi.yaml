      operationId: serverCtrl_ListPackagePins
      description: 'Liefert die globalen und die serverspezifischen Pins, ob das
        Feature hier verfügbar ist (auf Proxmox ausgenommen - dort verwaltet
        Proxmox die Kernel-Aufbewahrung selbst) und den Kernel-Vorschlag für die
        Paketverwaltung dieses Servers.


