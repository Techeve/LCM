      summary: Liefert das Ende des LCM-Logs.
      operationId: logsCtrl_List
      description: >-
        Das eigene Log des Dienstes, jüngste Zeile zuletzt. `lines` begrenzt die
        Menge (Vorgabe 300, Maximum 2000), `level` filtert nach Schwere
        (debug/info/warn/error), `q` nach Textbestandteil in der ganzen Zeile.


        Benötigte Berechtigung: `settings:manage` - im Log stehen Namen,
        Adressen und Kommandos ALLER Server.
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '404':
          description: Kein Dateiprotokoll konfiguriert.
  /api/v1/system/logs/stream:
    get:
      tags:
      - System
      summary: Streamt neue Logzeilen als Server-Sent Events.
      operationId: logsCtrl_Stream
      description: >-
        Liefert ab dem aktuellen Ende der Datei jede neue Zeile als SSE-Ereignis
        `log`; dazwischen `ping` als Herzschlag. Dieselben Filter wie bei der
        Liste (`level`, `q`). Der Strom endet nach 30 Minuten - der Browser baut
        ihn selbsttätig wieder auf.


        Hinweis für Clients: Die Anmeldung läuft über den Authorization-Header,
        den `EventSource` nicht setzen kann. Der Strom ist deshalb per `fetch`
        zu lesen; der Token gehört NICHT in die URL (er landete sonst in
        Zugriffs- und Proxy-Protokollen).


        Benötigte Berechtigung: `settings:manage`.
      responses:
        '200':
          description: Ereignisstrom.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '404':
          description: Kein Dateiprotokoll konfiguriert.
  /api/v1/system/logs/level:
    get:
      tags:
      - System
      summary: Liefert das wirksame Log-Level.
      operationId: logsCtrl_Level
      description: >-
        Das aktuell wirksame Level und - falls ein befristetes Debug läuft - der
        Zeitpunkt, zu dem es endet.


        Benötigte Berechtigung: `settings:manage`.
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
    post:
      tags:
      - System
      summary: Schaltet das befristete Debug-Log ein oder aus.
      operationId: logsCtrl_SetLevel
      description: >-
        `{"debug": true}` hebt das Level für 30 Minuten auf debug und stellt es
        danach selbsttätig zurück; `{"debug": false}` beendet es sofort. Die
        Frist ist Absicht: Debug schreibt jedes SSH-Kommando samt Ausgabe mit,
        und ein dauerhaft eingeschaltetes Debug füllt auf einer kleinen Maschine
        die Logdatei schneller, als die Rotation sie wegräumt.


        Benötigte Berechtigung: `settings:manage`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                debug:
                  type: boolean
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
