      description: 'Legt einen Server an, der sich per lcm-agent AUSGEHEND über
        MQTT verbindet - für Maschinen hinter NAT oder mit wechselnder Adresse,
        die LCM nicht per SSH erreichen kann.


        Das Enrollment-Token wird EINMALIG in der Antwort geliefert; gespeichert
        wird nur sein Hash. Es lässt sich nicht erneut anzeigen, nur ersetzen
        (siehe /servers/{id}/agent-token). Der Server ist zunächst offline und
        geht online, sobald sich der Agent meldet.


        Benötigte Berechtigung: `servers:write`.'
