  /api/v1/security/scanner:
    get:
      tags:
      - Sicherheit (global)
      summary: Stand des CVE-Scanners (Version + Schwachstellen-Datenbank).
      operationId: opsCtrl_ScannerStatus
      description: 'Liefert Version des Scanners (Trivy) und den Stand seiner
        Schwachstellen-Datenbank samt Frische-Bewertung.


        Warum das ein eigener Endpunkt ist: Trivy lädt die Datenbank beim Scan
        selbst nach - aber nur mit Netzzugang. Scheitert das (abgeschotteter
        Host, Proxy, Rate-Limit der Registry), WARNT Trivy und scannt mit der
        alten Datenbank weiter. Das Ergebnis ist dann kein Fehler, sondern
        „keine Sicherheitslücken gefunden": eine drei Wochen alte Datenbank
        sieht aus wie ein sauberer Server. Erst der Zeitstempel trennt beides.


        Bezugsgröße der Frische ist updated_at (wann der Hersteller die
        Datenbank gebaut hat), NICHT downloaded_at - wer dieselbe alte Datenbank
        täglich neu holt, hat trotzdem alte Daten. Schwellen: ab 48 Stunden
        „stale", ab 7 Tagen „critical".


        Benötigte Berechtigung: `packages:read`.'
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Scanner- und Datenbank-Stand.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Ist das Scanner-Binary vorhanden?
                  version:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
                    description: Wann der Hersteller diese Datenbank gebaut hat (maßgeblich).
                  next_update:
                    type: string
                    format: date-time
                  downloaded_at:
                    type: string
                    format: date-time
                    description: Wann dieser Host sie geholt hat - nur zur Diagnose.
                  freshness:
                    type: string
                    enum:
                    - fresh
                    - stale
                    - critical
                    - unknown
                  age_hours:
                    type: integer
                  error:
                    type: string
                    description: Warum der Stand nicht ermittelbar war (z.B. nie geladen).
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/security/scanner/update-db:
    post:
      tags:
      - Sicherheit (global)
      summary: Schwachstellen-Datenbank nachladen.
      operationId: opsCtrl_UpdateCVEDB
      description: 'Lädt die Schwachstellen-Datenbank herunter, ohne zu scannen
        (`trivy --download-db-only`). Asynchroner Job (202 {status, job_id,
        job_name}) - damit ein Fehlschlag samt Ausgabe des Werkzeugs im
        Protokoll landet statt still zu verpuffen. Genau dort steht dann auch
        die Ursache (kein Netz, Proxy, Rate-Limit der Registry).


        Der Job hängt an keinem Server: Scanner und Datenbank liegen zentral
        auf dem LCM-Host.


        Benötigte Berechtigung: `settings:manage`.'
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job gestartet.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
          description: Der CVE-Scanner ist auf dem LCM-Host nicht installiert.
