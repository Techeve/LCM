      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Tauscht den Subscription-Key beim Anbieter-Dienst gegen einen an diese
        Instanz gebundenen Repository-Zugangsschlüssel (die erste Instanz gewinnt; ein bereits
        anderweitig gebundener Key wird mit Klartext abgelehnt). Key und Zugangsschlüssel werden
        AES-GCM-verschlüsselt gespeichert. Benötigte Berechtigung: `settings:manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription_key]
              properties:
                subscription_key:
                  type: string
                  description: Der vom Anbieter ausgestellte Key (LCM-E-…).
                service_url:
                  type: string
                  description: Optionale eigene Dienst-Adresse (leer = Standard).
      responses:
        '200':
          description: Aktiviert; antwortet mit dem neuen Status.
        '400':
          description: Abgelehnt (unbekannt, abgelaufen, widerrufen oder an eine andere Instanz gebunden).
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/subscription/apt:
    post:
      tags:
      - Einstellungen
      summary: LCM-Host auf einen Paketkanal umstellen (community, beta oder enterprise).
      operationId: subCtrl_SetAptChannel
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Startet einen Job auf dem selbst-registrierten LCM-Host. `enterprise`:
        Zugangsdaten in apt auth.conf.d, eigene Enterprise-Quelle, Kanaltrennung, Prüfung nur
        gegen die neue Quelle mit Rückbau bei Fehlschlag - verlangt eine aktive Subscription.
        `beta`: offene Beta-Quelle neben der Community-Quelle (kein Zugang nötig). `community`:
        der Rückweg, der nie ohne Paketquelle zurücklässt. Das frühere Feld `enable` gilt
        weiterhin, solange kein `channel` mitkommt (true = enterprise).
        Benötigte Berechtigung: `settings:manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [community, beta, enterprise]
                enable:
                  type: boolean
                  description: Veraltet - nur ausgewertet, wenn channel fehlt.
      responses:
        '202':
          description: Job gestartet (Job-Objekt in der Antwort).
        '400':
          description: Nicht möglich (unbekannter Kanal, keine aktive Subscription oder kein LCM-Host mit apt).
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
          description: Auf dem LCM-Host läuft bereits ein Job.
