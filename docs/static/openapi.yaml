      - Server
      summary: Zeitzone, Zeitdienst und Uhrenversatz auslesen.
      operationId: serverCtrl_TimeState
      description: >-
        Liest den Zeit-Zustand frisch vom Server (rein lesend, ohne Sonderrechte) und speichert ihn: Zeitzone, laufender Zeitdienst, ob er die Uhr als synchronisiert meldet, die konfigurierten Zeitserver und die Abweichung gegenueber LCM. Die Abweichung enthaelt die SSH-Laufzeit und ist auf ein bis zwei Sekunden genau. Benoetigte Berechtigung -- servers:read.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Der Server mit aktualisiertem Zeit-Zustand.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '502':
          description: Zielsystem nicht erreichbar.
  /api/v1/servers/{id}/timezone:
    post:
      tags:
      - Server
      summary: Zeitzone des Servers setzen.
      operationId: serverCtrl_SetTimezone
      description: >-
        Setzt die Zeitzone und LIEST SIE ZURUECK. Meldet das System danach etwas anderes, gilt sie als nicht gesetzt (502) -- eine geschriebene Datei allein ist kein Beleg. Fehlt die Zone auf dem Zielsystem (tzdata nicht installiert), sagt die Meldung genau das. Benoetigte Berechtigung -- servers:write.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: Zeitzone im IANA-Format.
                  example: Europe/Berlin
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Gesetzt und zurueckgelesen.
        '400':
          description: Ungueltige Zeitzone.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '502':
          description: Auf dem Zielsystem nicht gesetzt bzw. nicht bestaetigt.
  /api/v1/servers/{id}/ntp:
    post:
      tags:
      - Server
      summary: Zeitserver eintragen und Synchronisierung belegen.
      operationId: serverCtrl_ConfigureNTP
      description: >-
        Traegt die Zeitserver ein (chrony, systemd-timesyncd oder ntpd -- je nachdem was vorhanden ist), startet den Dienst und BELEGT die Synchronisierung. Bestehende server/pool-Zeilen werden ersetzt, der Rest der Datei bleibt, eine .lcm-bak-Sicherung entsteht. Bleibt der Nachweis im Zeitfenster aus, endet der Aufruf mit 502 und einer Meldung, die genau das sagt -- die Konfiguration bleibt dabei bestehen. Benoetigte Berechtigung -- servers:write.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                servers:
                  type: array
                  maxItems: 4
                  items:
                    type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Zeitserver gesetzt, Synchronisierung belegt.
        '400':
          description: Ungueltiger Zeitserver oder mehr als vier.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
          description: Container -- die Uhr kommt vom Host und ist hier nicht einstellbar.
        '502':
          description: Zeitserver eingetragen, Synchronisierung aber nicht nachweisbar.
