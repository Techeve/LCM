  /api/v1/auth/password-reset:
    post:
      tags:
      - Auth
      summary: Stößt den Self-Service-Passwort-Reset per E-Mail an.
      operationId: authCtrl_RequestPasswordReset
      description: 'Stößt den Self-Service-Passwort-Reset per E-Mail an. Die Antwort ist IMMER dieselbe
        - ob die Adresse existiert, ist nach außen nicht erkennbar (keine User-Enumeration). Pro Client-IP
        gedrosselt: hier zählt JEDER Aufruf als Versuch, nicht nur Fehlversuche - der Endpunkt ist anonym
        und löst Mail-Versand aus.


        Öffentlicher Endpunkt (keine Authentifizierung nötig).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      security: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
