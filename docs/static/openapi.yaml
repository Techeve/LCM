          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - excellent
                    - green
                    - yellow
                    - red
                  insights:
                    type: array
                    description: >-
                      Befunde der Bewertung. Stufe "info" sind reine Hinweise -
                      sie erklaeren etwas, aendern die Ampel aber nicht.
                    items:
                      type: object
