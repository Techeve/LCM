    post:
      tags:
      - Linux-Benutzer
      summary: Liefert das einmalige Token für den Self-Service-Link.
      operationId: linuxCtrl_GenerateActivation
      description: >-
        Liefert das einmalige Token für den Self-Service-Link, über den der
        Mitarbeiter Passwort und/oder SSH-Schlüssel selbst setzt.


        Mit `send_email` geht der Link zusätzlich an die am Linux-Benutzer
        hinterlegte Adresse. Er kommt in JEDEM Fall auch in der Antwort zurück:
        Scheitert der Versand (`mailed: false`, `mail_error`), hat der
        Administrator ihn trotzdem vor sich und kann ihn von Hand weitergeben -
        der Link ist ja bereits gültig.


        Der Text der Mail richtet sich danach, ob der Account schon
        Zugangsdaten hat: Ohne welche lädt er zum Einrichten ein, mit welchen
        spricht er vom Zurücksetzen. Es ist derselbe Link - aber eine Einladung
        für einen Zugang, den jemand längst nutzt, sieht aus wie ein
        Angriffsversuch.


        Benötigte Berechtigung: `linux-users:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_hours:
                  type: integer
                send_email:
                  type: boolean
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
