        '403':
          description: Keine Berechtigung.
    post:
      tags:
      - Server
      summary: Paket-Pin anlegen (global oder für diesen Server).
      operationId: serverCtrl_CreatePackagePin
      description: 'Legt einen Pin an. Ein Pin schützt ein Paket vor dem Aufräumen
        (Autoremove) und dem gezielten Entfernen (no_remove) und/oder friert seine
        Version ein (hold). Ein abschließendes `*` im Namen wirkt als
        Präfix-Muster (`linux-image-*`). Existiert derselbe Name im selben
        Geltungsbereich bereits, werden dessen Wirkungen aktualisiert.


        Der Pin wirkt auf dem Ziel, sobald er angewendet wird (eigener Endpunkt)
        oder der nächste Aufräum-Lauf läuft - dieser schreibt die Schutzdateien
        selbst, bevor er entfernt.


        Benötigte Berechtigung: `servers:write`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Paketname oder Präfix-Muster mit abschließendem *.
                no_remove:
                  type: boolean
                  default: true
                hold:
                  type: boolean
                  default: false
                note:
                  type: string
                global:
                  type: boolean
                  description: true = gilt für ALLE Server.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '201':
          description: Pin angelegt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  server_id:
                    type: integer
                  name:
                    type: string
                  no_remove:
                    type: boolean
                  hold:
                    type: boolean
                  note:
                    type: string
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
          description: Auf Proxmox-Systemen ausgenommen.
        '422':
          description: Ungültiger Paketname oder Pin ohne Wirkung.
