      summary: Deep Scan anstoßen (Kernel-Reboot-Lücke, Kernel-CVEs, Härtungs-Audit).
      operationId: opsCtrl_DeepScanServer
      description: 'Stößt den Deep Scan auf dem Server an: offene
        Kernel-Reboot-Lücke (needrestart), kernel-bezogene CVEs und ein
        Härtungs-/Fehlkonfigurations-Audit (Lynis, sonst LCM-Eigenprüfungen).


        Läuft asynchron über den Scheduler und liefert daher KEINE Job-ID: Der
        Abschluss ist am geänderten Zeitstempel des Berichts (GET) erkennbar.
        Der Scan ist rein lesend und läuft auch im eingeschränkten Sudo-Modus.


        Benötigte Berechtigung: `servers:write`.'
      parameters:
      - name: id
        in: path
        required: true
