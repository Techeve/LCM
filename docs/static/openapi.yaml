      responses:
        '200':
          description: Scan angestoßen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/servers/{id}/deep-scan/reports/{reportId}:
    get:
      tags:
      - Server
      summary: Ein einzelner, datierter Deep-Scan-Lauf samt seiner Befunde.
      operationId: serverCtrl_DeepScanReportDetail
      description: 'Jeder Deep Scan wird als eigener Bericht abgelegt. Dieser
        Endpunkt liefert einen davon vollstaendig - mit `is_new` je Befund
        (stand im vorhergehenden Lauf noch nicht) und `resolved_titles` (was
        seither verschwunden ist). Die Liste der Laeufe steht in
        `GET /servers/{id}/deep-scan` unter `reports`.


        Die Report-ID wird gegen den Server geprueft: eine fremde ID liefert
        404, nicht die Befunde eines anderen Servers.


        Benoetigte Berechtigung: `servers:read`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: reportId
        in: path
        required: true
        description: UUID des Laufs (aus `reports[].id`).
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Der Lauf samt Befunden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  critical:
                    type: integer
                  warnings:
                    type: integer
                  infos:
                    type: integer
                  new_findings:
                    type: integer
                    description: Befunde, die im vorhergehenden Lauf noch nicht standen (erster Lauf immer 0).
                  resolved_findings:
                    type: integer
                  resolved_titles:
                    type: string
                    description: JSON-Array der seit dem Vorlauf verschwundenen Befund-Titel.
                  hardening_index:
                    type: integer
                    nullable: true
                  tools:
                    type: string
                    description: Werkzeuge dieses Laufs, z.B. "needrestart,lynis".
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        category:
                          type: string
                          enum: [kernel, restart, misconfig]
                        severity:
                          type: string
                          enum: [info, warning, critical]
                        title:
                          type: string
                        detail:
                          type: string
                        tool:
                          type: string
                        is_new:
                          type: boolean
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '404':
          description: Lauf nicht gefunden (oder gehoert zu einem anderen Server).
