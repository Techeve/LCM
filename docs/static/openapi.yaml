                type: object
                properties:
                  server:
                    type: object
                  token:
                    type: string
                    description: Enrollment-Token - wird nie wieder angezeigt.
        '400':
          description: Name fehlt oder ungültiger Request-Body.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
