  /api/v1/servers/{id}/security-tool:
    post:
      tags:
      - Server
      summary: fail2ban bzw. CrowdSec installieren und einrichten.
      operationId: serverCtrl_ConfigureSecurityTool
      description: 'Installiert und konfiguriert einen Brute-Force-Schutz auf dem
        Server. Asynchroner Job (202 {status, job_id, job_name}).


        Aussperr-Schutz: Die IP, mit der LCM den Server gerade erreicht, landet
        immer in der Allowlist (`ignoreip` bei fail2ban, Parser-Whitelist bei
        CrowdSec) - zusammen mit Loopback und den hier angegebenen Quellen. Die
        Quell-IP wird dafür ohne `sudo` gelesen (`$SSH_CONNECTION`), weil `sudo`
        diese Variable verwirft.


        Lässt sich eine referenzierte Allowlist nicht auflösen, bricht LCM den
        Schutz NICHT ab, hängt aber eine sichtbare `LCM-WARNUNG` an den
        Job-Output - niemand soll Schutz vermuten, den es nicht gibt.


        Die Einrichtung greift in Dienste und Systemkonfiguration ein und ist
        deshalb im eingeschränkten Modus (sudo-Whitelist) gesperrt. Für die
        Bedienung eines bereits installierten Werkzeugs siehe
        /security-tool/manage.


        Benötigte Berechtigung: `servers:write`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool
              properties:
                tool:
                  type: string
                  enum:
                  - fail2ban
                  - crowdsec
                allowlist_ips:
                  type: array
                  description: Zusätzliche Quellen, die nie gesperrt werden - IP oder CIDR.
                  items:
                    type: string
                allowlist_ids:
                  type: array
                  description: IDs benannter IP-Allowlists; ihre Einträge kommen hinzu.
                  items:
                    type: integer
                bouncer:
                  type: boolean
                  default: true
                  description: >-
                    Nur CrowdSec - Firewall-Bouncer mitinstallieren (setzt die Sperren erst durch).
                    Fehlt das Feld, gilt true: ohne Bouncer erkennt CrowdSec zwar, sperrt aber nichts.
                  example: true
                collections:
                  type: array
                  description: Nur CrowdSec - zu installierende Collections. Leer = crowdsecurity/sshd.
                  items:
                    type: string
                lapi_mode:
                  type: string
                  description: >-
                    Nur CrowdSec - LAPI-Anbindung. local = eigenständig auf diesem
                    Server (Vorgabe); remote/console setzen einen unter
                    Einstellungen hinterlegten Zugang voraus.
                  enum:
                  - local
                  - remote
                  - console
                  default: local
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job gestartet.
        '400':
          description: >-
            Unbekanntes Werkzeug, ungültige Allowlist-IP, ungültiger
            Collection-Name oder LAPI-Modus, oder der gewählte remote/console-Modus
            ist nicht hinterlegt.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
          description: >-
            Eingeschränkter Modus (die Einrichtung braucht vollen Sudo-Zugriff),
            RouterOS-Gerät, oder CrowdSec ist auf dieser Distribution nicht
            verfügbar (pacman).
  /api/v1/servers/{id}/security-tool/bans:
    get:
      tags:
      - Server
      summary: Aktuelle Sperrliste eines installierten Sicherheits-Tools.
      operationId: serverCtrl_SecurityToolBans
      description: 'Liefert die aktuell gesperrten IP-Adressen von fail2ban bzw.
        CrowdSec, über beide Werkzeuge hinweg vereinheitlicht. Bewusst SYNCHRON
        (kein Job): Für eine reine Abfrage wäre Job-Polling unangemessen, und wer
        sich selbst ausgesperrt hat, will die Liste sofort sehen. Demo-Server
        liefern eine leere Liste (kein SSH-Kontakt).


        Benötigte Berechtigung: `servers:read`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tool
        in: query
        required: true
        description: fail2ban | crowdsec
        schema:
          type: string
          enum:
          - fail2ban
          - crowdsec
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Sperrliste.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bans:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                        scope:
                          type: string
                          description: 'fail2ban: Jail - CrowdSec: Szenario.'
                        since:
                          type: string
                          description: 'CrowdSec: verbleibende Dauer.'
                        cause:
                          type: string
                          description: 'CrowdSec: Ursprung der Entscheidung.'
                        tool:
                          type: string
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '422':
          description: Unbekanntes Werkzeug oder nicht unterstützter Server.
  /api/v1/servers/{id}/security-tool/manage:
    post:
      tags:
      - Server
      summary: Ein installiertes Sicherheits-Tool bedienen (Dienst, Allowlist, Sperren).
      operationId: serverCtrl_ManageSecurityTool
      description: 'Bedient ein BEREITS installiertes fail2ban bzw. CrowdSec:
        Dienst steuern (start/stop/restart/enable/disable), deinstallieren,
        Allowlist neu schreiben und nachladen oder eine Sperre aufheben.
        Asynchroner Job (202 {status, job_id, job_name}).


        Die Aktionen greifen in Dienste und Systemkonfiguration ein und sind
        deshalb im eingeschränkten Modus (sudo-Whitelist) gesperrt. Ist das
        Werkzeug auf dem Server nicht installiert, endet der Job mit einem
        Fehler statt einer irreführenden Erfolgsmeldung.


        Benötigte Berechtigung: `servers:write`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool
              - action
              properties:
                tool:
                  type: string
                  enum:
                  - fail2ban
                  - crowdsec
                action:
                  type: string
                  enum:
                  - start
                  - stop
                  - restart
                  - enable
                  - disable
                  - uninstall
                  - allowlist
                  - unban
                unban_ip:
                  type: string
                  description: Nur bei action=unban - die freizugebende Adresse.
                allowlist_ips:
                  type: array
                  description: Nur bei action=allowlist - zusätzliche freie IPs/CIDRs.
                  items:
                    type: string
                allowlist_ids:
                  type: array
                  description: Nur bei action=allowlist - IDs benannter IP-Allowlists.
                  items:
                    type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job gestartet.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung (im eingeschränkten Modus gesperrt).
        '422':
          description: Unbekanntes Werkzeug, unbekannte Aktion oder fehlende/ungültige IP.
