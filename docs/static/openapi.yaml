    post:
      tags:
      - Server
      summary: Probe DSM
      operationId: serverCtrl_ProbeDSM
      description: >-
        Liest den SHA-256-Fingerprint des TLS-Zertifikats eines
        Synology-DSM-Geräts - zur Bestätigung im Onboarding, BEVOR
        Zugangsdaten übertragen werden (DSM liefert ab Werk ein
        selbstsigniertes Zertifikat; das Pinning ist hier der MitM-Schutz).


        Benötigte Berechtigung: `servers:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  description: DSM-HTTPS-Port; leer/0 = 5001.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Erfolgreich.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '502':
          description: DSM nicht erreichbar.
  /api/v1/servers/dsm:
    post:
      tags:
      - Server
      summary: Create DSM
      operationId: serverCtrl_CreateDSM
      description: >-
        Nimmt ein Synology-DSM-Gerät zur Überwachung über die DSM-Web-API auf
        (kein SSH, kein Service-User). LCM meldet sich an, erhebt Version,
        Updates, Pakete, Volumes, Zeit/NTP und die Befunde des
        DSM-Security-Advisors und legt das Gerät online an.


        Benötigte Berechtigung: `servers:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                  description: DSM-HTTPS-Port; leer/0 = 5001.
                account:
                  type: string
                  description: >-
                    DSM-Konto der Administratorgruppe, moeglichst ohne
                    erzwungene 2FA (ein unbeaufsichtigter Scan kann keinen
                    Einmalcode liefern).
                password:
                  type: string
                confirmed_fingerprint:
                  type: string
                  description: >-
                    Der in der Oberflaeche bestaetigte
                    Zertifikats-Fingerprint (SHA-256).
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '201':
          description: Erfolgreich.
        '400':
          description: Ungueltige Eingabe oder Fingerprint-Abweichung.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
        '409':
          description: Name oder Host bereits vergeben.
