                        severity:
                          type: string
                          enum:
                          - info
                          - warning
                          - critical
                        message:
                          type: string
                  os_support:
                    type: object
                  docker_port_exposures:
                    type: array
                    items:
                      type: object
                  kernel:
                    type: object
                    description: >-
                      Laufender Kernel (uname -r) und installierte Kernel-Pakete.
                      Erst der Abgleich beider Angaben sagt etwas: Nach einem
                      Kernel-Update ist der neue installiert, laeuft aber erst
                      nach einem Neustart.
                    properties:
                      running:
                        type: string
                        description: Ausgabe von uname -r - der tatsaechlich gebootete Kernel.
                      installed:
                        type: array
                        description: >-
                          Installierte Kernel-Pakete, neueste zuerst. In
                          Containern LEER (siehe managed).
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            release:
                              type: string
                            version:
                              type: string
                            running:
                              type: boolean
                      managed:
                        type: boolean
                        description: >-
                          false in Containern (LXC, Docker, …): dort laeuft der
                          Kernel des Hosts und ist von innen nicht verwaltbar.
                      container:
                        type: string
                        description: Erkannter Container-Typ, wenn managed=false.
                      reboot_pending:
                        type: boolean
                        description: Es ist ein neuerer Kernel installiert als der laufende.
        '401':
