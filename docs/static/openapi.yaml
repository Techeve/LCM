      description: 'Body {enable:bool, rules:[{port,proto,ip_version,allowlist_ids,source_ips,comment}], ssh_sources:{allowlist_ids,source_ips}, ports:"80,443"}. enable=false
        deaktiviert die Firewall; rules sind die detaillierten Freigaben (proto tcp|udp, ip_version any|v4|v6,
        allowlist_ids = IDs benannter IP-Allowlists, source_ips = händische Quell-IPs/CIDRs -
        beides zusammen schränkt die Freigabe als Union auf diese Quellen ein; ohne beide gilt sie für alle Quellen;
        comment = freie Bemerkung, landet bei ufw/nftables im Regelsatz auf dem Zielsystem),
        ports ist der Legacy-CSV-Weg (nur TCP). Asynchroner Job - je nach Distribution
        wird das Firewall-Werkzeug (ufw/firewalld/nftables) erst installiert; Antwort 202 {status, job_id, job_name}.


