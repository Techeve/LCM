  /api/v1/servers/{id}/terminal/ticket:
    post:
      tags:
      - Server
      summary: Stellt eine Einmal-Fahrkarte für die Web-Konsole aus.
      operationId: terminalCtrl_Ticket
      description: >-
        Liefert eine dreißig Sekunden gültige Einmal-Fahrkarte, mit der
        anschließend die WebSocket-Verbindung zur Konsole aufgebaut wird.


        Warum der Umweg: Die WebSocket-Schnittstelle des Browsers kann keine
        eigenen Kopfzeilen setzen, der Anmelde-Token käme dort nicht an. Ihn an
        die URL zu hängen verbietet sich - URLs stehen in Zugriffs- und
        Proxy-Protokollen, und dieser Zugang öffnet eine Root-Shell. Die
        Fahrkarte gilt einmal, kurz und nur für diesen einen Server; steht sie
        später in einem Protokoll, ist sie längst wertlos.


        Benötigte Berechtigung: `servers:console` - bewusst NICHT in
        `servers:write` enthalten.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Fahrkarte ausgestellt.
        '401':
          description: Nicht angemeldet.
        '403':
          description: Keine Berechtigung.
  /api/v1/servers/{id}/terminal:
    get:
      tags:
      - Server
      summary: Öffnet die interaktive Konsole (WebSocket).
      operationId: terminalCtrl_Connect
      description: >-
        Baut die Konsolen-Verbindung auf. Nachweis ist die Fahrkarte aus
        `POST /terminal/ticket` (`?ticket=…`), nicht der Anmelde-Token - der
        Endpunkt trägt deshalb keine Permission-Prüfung.


        Über die Verbindung laufen Tastenanschläge als Binärnachrichten; eine
        Größenänderung wird als Textnachricht `{"type":"resize","cols":…,"rows":…}`
        geschickt, damit sie nicht als Eingabe im Terminal landet. Die Ausgabe
        kommt binär zurück.


        Die Sitzung wird MITGESCHNITTEN und liegt danach im SSH-Protokoll. Sie
        belegt den Ausführungs-Slot des Servers: Solange die Konsole offen ist,
        laufen dort keine Zeitpläne. Nach 15 Minuten ohne Eingabe endet sie von
        selbst.


        Nicht möglich auf Demo-Servern, Synology DSM, Agent-Servern (der
        Transport führt keinen Strom) und Servern in Wartung.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: ticket
        in: query
        required: true
        schema:
          type: string
      - name: cols
        in: query
        schema:
          type: integer
      - name: rows
        in: query
        schema:
          type: integer
      security: []
      responses:
        '101':
          description: Verbindung aufgebaut.
        '400':
          description: Auf diesem Server ist keine Konsole möglich.
        '401':
          description: Ungültige oder abgelaufene Fahrkarte.
        '403':
          description: Die Web-Konsole ist abgeschaltet.
        '409':
          description: Auf dem Server läuft gerade etwas anderes.
