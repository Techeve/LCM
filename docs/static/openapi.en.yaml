      operationId: serverCtrl_ProbeDSM
      description: |-
        Reads the SHA-256 fingerprint of the TLS certificate of a Synology DSM device - for confirmation during onboarding, BEFORE credentials are transmitted (DSM ships with a self-signed certificate by default; pinning is the MitM protection here).

        Required permission: `servers:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  description: DSM HTTPS port; empty/0 = 5001.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '502':
          description: DSM not reachable.
  /api/v1/servers/dsm:
    post:
      tags:
      - Servers
      summary: Create DSM
      operationId: serverCtrl_CreateDSM
      description: |-
        Adds a Synology DSM device for monitoring via the DSM web API (no SSH, no service user). LCM signs in, collects version, updates, packages, volumes, time/NTP and the findings of the DSM Security Advisor, and creates the device online.

        Required permission: `servers:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                  description: DSM HTTPS port; empty/0 = 5001.
                account:
                  type: string
                  description: DSM account in the administrators group, preferably without enforced 2FA (an unattended scan cannot supply a one-time code).
                password:
                  type: string
                confirmed_fingerprint:
                  type: string
                  description: The certificate fingerprint (SHA-256) confirmed in the UI.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '201':
          description: Successful.
        '400':
          description: Invalid input or fingerprint mismatch.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '409':
