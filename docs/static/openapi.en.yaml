      operationId: systemCtrl_Info
      description: |-
        Returns version, build number and runtime data of the application. Additionally contains agent_port - the dedicated port of the lcm-agent listener (LCM Remote), from which the UI builds the enroll URL; 0 = no dedicated agent listener active.

        Public endpoint (no authentication needed).
