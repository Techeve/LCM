openapi: 3.0.3
info:
  title: LCM REST API
  version: 1.29.0
  description: |-
    The complete REST API of the LCM backend (Go/Fiber). The web frontend uses exactly these endpoints - there is no separate internal API.

    **Authentication** (see security schemes):
    - `X-API-Key: <key>` - scripts and service-to-service access with a key created under *Settings → API keys* and restricted to scopes. This is the way for anything automated.
    - Browser session, issued by `POST /auth/login` (or `/auth/login/2fa` when 2FA is enabled). How the browser carries it is set by the operator under *Settings → General → Sign-in in the browser* (`browser_session_mode`): `memory` (default, header `X-LCM-Session`) or `cookie` (HTTPS only).

    `Authorization: Bearer` does not count as sign-in on this API.

    Permissions are checked per endpoint via RBAC scope (noted in the description as `area:read`/`area:write`); for servers, the visible data is additionally restricted to the groups of the respective user.

    This reference is maintained by hand; a test compares its paths and methods with the server's routes on every run (`internal/api/router/router.go`). Not every endpoint has a fully documented response schema; the actual response follows the respective domain model (see architecture).
servers:
- url: /api/v1
  description: Relative to the LCM instance, e.g. https://lcm.example.com/api/v1
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: X-LCM-Session
      description: The `session_token` from POST /auth/login (`memory` variant, default). It is valid only for this session and only via the header. In the `cookie` variant (HTTPS only), the login returns the cookie `__Host-lcm_session` instead (HttpOnly, Secure, SameSite=Strict, Path=/); state-changing requests with a cookie additionally need the header `X-CSRF-Token` with the value from `csrf_token` or the cookie `__Host-lcm_csrf`, otherwise 403 `auth.csrf_invalid`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Service API key from Settings → API keys.
tags:
- name: API keys
- name: Alerts
- name: Alert rules
- name: Apps
- name: Auth
- name: Notification channels
- name: Users (LCM login)
- name: Privilege profiles
- name: Custom actions
- name: Dashboard
- name: Docker (global)
- name: Settings
- name: Events
- name: Jobs & audit
- name: Linux users
- name: Packages (global)
- name: Rules
- name: Roles
- name: SSH sessions
- name: Servers
- name: Server users
- name: Server groups
- name: Security (global)
- name: System
- name: Schedules
paths:
  /api/v1/agent/download/{arch}:
    get:
      tags:
      - System
      summary: Download the lcm-agent binary (LCM Remote).
      operationId: controllers_AgentDownload
      description: |-
        Returns the lcm-agent binary for manual installation on a server that is supposed to connect OUTBOUND (NAT/roaming).

        Deliberately PUBLIC - no login needed and exempt from the IP allowlist: the binary is a published artifact without secrets, and the target server has no credentials yet during setup. The secret is the enrollment token, not the binary.

        No permission needed.
      parameters:
      - name: arch
        in: path
        required: true
        description: Target architecture.
        schema:
          type: string
          enum:
          - amd64
          - arm64
      security: []
      responses:
        '200':
          description: Binary.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No binary is available for this architecture.
  /api/v1/alert-events:
    get:
      tags:
      - Alerts
      summary: Alert history, newest first.
      operationId: alertCtrl_Events
      description: |-
        Paginated with filters; only events of servers within the caller's visibility scope, events without a server for admins only. Response: {items, total}.

        Required permission: `alerts:manage`.
      parameters:
      - name: server_id
        in: query
        required: false
        schema:
          type: integer
        description: Only events of this server.
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Alert type.
      - name: severity
        in: query
        required: false
        schema:
          type: string
          enum:
          - info
          - warning
          - critical
        description: Severity.
      - name: since
        in: query
        required: false
        schema:
          type: string
        description: Earliest point in time (RFC 3339).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size (default 100, maximum 500).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Number of matches to skip.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: 'Success: {items, total}.'
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/alert-rules:
    get:
      tags:
      - Alert rules
      summary: List
      operationId: alertCtrl_List
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `alerts:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    post:
      tags:
      - Alert rules
      summary: Create
      operationId: alertCtrl_Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                enabled:
                  type: boolean
                group_ids:
                  type: array
                  items:
                    type: integer
                channel_id:
                  type: string
                severity:
                  type: string
                threshold_percent:
                  type: integer
                forecast_days:
                  type: integer
                max_outdated:
                  type: integer
                min_severity:
                  type: string
                heartbeat_hours:
                  type: integer
                cooldown_minutes:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `alerts:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/alert-rules/{id}:
    patch:
      tags:
      - Alert rules
      summary: Update
      operationId: alertCtrl_Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                enabled:
                  type: boolean
                group_ids:
                  type: array
                  items:
                    type: integer
                channel_id:
                  type: string
                severity:
                  type: string
                threshold_percent:
                  type: integer
                forecast_days:
                  type: integer
                max_outdated:
                  type: integer
                min_severity:
                  type: string
                heartbeat_hours:
                  type: integer
                cooldown_minutes:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `alerts:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    delete:
      tags:
      - Alert rules
      summary: Delete
      operationId: alertCtrl_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `alerts:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/alerts/evaluate:
    post:
      tags:
      - Alerts
      summary: Triggers an immediate evaluation of all alert rules.
      operationId: alertCtrl_Evaluate
      description: |-
        Triggers an immediate evaluation of all alert rules.

        Required permission: `alerts:manage`.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/apikeys:
    get:
      tags:
      - API keys
      summary: List
      operationId: apiKeyCtrl_List
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `apikeys:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    post:
      tags:
      - API keys
      summary: The plaintext key is contained ONLY in this response.
      operationId: apiKeyCtrl_Create
      description: |-
        The plaintext key is contained ONLY in this response.

        Required permission: `apikeys:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                expires_in_days:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/apikeys/{id}:
    delete:
      tags:
      - API keys
      summary: Revoke
      operationId: apiKeyCtrl_Revoke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: |-
        Two-step: the first call REVOKES the key (immediately invalid, the entry stays visible with revoked=true as history); a second call on the already revoked key removes it permanently.

        Required permission: `apikeys:manage`.
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/apps:
    get:
      tags:
      - Apps
      summary: 'App catalog: profiles of the software beside the package manager.'
      operationId: appCtrl_ListApps
      description: |-
        Returns all catalog entries, bundled ones first. Each entry describes how an app is detected, how its version is determined, and where the latest version is found.




        Required permission: `settings:manage`.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    post:
      tags:
      - Apps
      summary: Create a custom catalog entry.
      operationId: appCtrl_CreateApp
      description: |-
        Creates a custom entry. At least one feature is required; features must not contain special characters because they are inserted into a command line during the scan.




        Required permission: `settings:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                markers:
                  type: string
                  description: One feature line per line, "kind value" (path|unit|bin|proc).
                version_command:
                  type: string
                  description: The placeholder {path} is replaced by the location where the app was found.
                version_pattern:
                  type: string
                compare:
                  type: string
                  enum:
                  - semver
                  - exact
                  - none
                latest_source:
                  type: string
                  description: github:owner/repo or url:https://…
                latest_pattern:
                  type: string
                backup_action_id:
                  type: integer
                update_action_id:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/apps/{id}:
    delete:
      tags:
      - Apps
      summary: Remove your own catalog entry.
      operationId: appCtrl_DeleteApp
      description: |-
        Removes a self-created entry together with the findings that point to it. Bundled entries can be disabled but not deleted (403).




        Required permission: `settings:manage`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    put:
      tags:
      - Apps
      summary: Change a catalog entry.
      operationId: appCtrl_UpdateApp
      description: |-
        Changes an entry. For bundled entries, the detection fields are reset to the shipped state on the next start; switches and action references are kept.




        Required permission: `settings:manage`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                markers:
                  type: string
                  description: One feature line per line, "kind value" (path|unit|bin|proc).
                version_command:
                  type: string
                  description: The placeholder {path} is replaced by the location where the app was found.
                version_pattern:
                  type: string
                compare:
                  type: string
                  enum:
                  - semver
                  - exact
                  - none
                latest_source:
                  type: string
                  description: github:owner/repo or url:https://…
                latest_pattern:
                  type: string
                backup_action_id:
                  type: integer
                update_action_id:
                  type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/audit:
    get:
      tags:
      - Jobs & audit
      summary: Audit Log
      operationId: jobCtrl_AuditLog
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `audit:read`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/2fa/disable:
    post:
      tags:
      - Auth
      summary: Disable T O T P
      operationId: authCtrl_DisableTOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/2fa/enable:
    post:
      tags:
      - Auth
      summary: Enable T O T P
      operationId: authCtrl_EnableTOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/2fa/setup:
    post:
      tags:
      - Auth
      summary: Setup T O T P
      operationId: authCtrl_SetupTOTP
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 'First step: verifies credentials.'
      operationId: authCtrl_Login
      description: |-
        First step: verifies credentials. If the user has 2FA enabled, NO session is opened; instead a challenge is returned - the second step (/auth/login/2fa) verifies the TOTP code.

        On successful login the response contains `user`, `must_setup_2fa` and, depending on the setting, `browser_session_mode`: `session_token` (variant `memory`, no cookie) or `csrf_token` (variant `cookie`, the cookies are in Set-Cookie). If the setting is `cookie` but the request came in over HTTP, the session runs as `memory`.

        Public endpoint (no authentication needed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      security: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/login/2fa:
    post:
      tags:
      - Auth
      summary: 'Second step: verifies the TOTP code against the challenge and opens the session.'
      operationId: authCtrl_LoginTOTP
      description: |-
        Second step: verifies the TOTP code against the challenge and opens the session (response as for /auth/login).

        Public endpoint (no authentication needed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge:
                  type: string
                code:
                  type: string
      security: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Ends the browser session on the server side and closes its event connections.
      operationId: authCtrl_Logout
      description: Ends the browser session on the server side and closes its event connections. A cookie is only deleted if the browser sends one.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Profile of the signed-in user including permissions, 2FA and mandatory-step state, language, session mode and CSRF token.
      operationId: authCtrl_Me
      description: 'Fields: id, username, email, first_name, last_name, display_name, roles, permissions, totp_enabled, must_change_password, must_setup_2fa, language (empty = not chosen), for a browser session session_mode (`memory` or `cookie`) and - for a cookie session - csrf_token.'
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/auth/me/preferences:
    patch:
      tags:
      - Auth
      summary: Saves account settings (currently the interface language).
      operationId: authCtrl_UpdatePreferences
      description: Saves the language on the user account; it applies on all devices. `language` is a BCP-47 tag of 2 to 10 characters (`de`, `en`, `en-GB`), otherwise 400 `auth.language_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Successful.
        '400':
          description: Invalid language code.
        '401':
          description: Not signed in.
        '403':
          description: No permission, or CSRF token missing.
  /api/v1/auth/password-reset:
    post:
      tags:
      - Auth
      summary: Starts the self-service password reset by email.
      operationId: authCtrl_RequestPasswordReset
      description: |-
        Starts the self-service password reset by email. The response is ALWAYS the same - whether the address exists cannot be determined from outside (no user enumeration). Throttled per client IP: here EVERY call counts as an attempt, not only failed attempts - the endpoint is anonymous and triggers sending mail.

        Public endpoint (no authentication needed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      security: []
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/custom-actions:
    get:
      tags:
      - Custom actions
      summary: List
      operationId: customActionCtrl_List
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `rules:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    post:
      tags:
      - Custom actions
      summary: Create
      operationId: customActionCtrl_Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                commands:
                  type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `rules:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/custom-actions/{id}:
    patch:
      tags:
      - Custom actions
      summary: Update
      operationId: customActionCtrl_Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                commands:
                  type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `rules:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    delete:
      tags:
      - Custom actions
      summary: Delete
      operationId: customActionCtrl_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `rules:manage`.'
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/dashboard:
    get:
      tags:
      - Dashboard
      summary: Everything for the start page in one call.
      operationId: dashboardCtrl_Get
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Required permission: `servers:read`. Returns status tiles, servers needing action, the latest jobs, the next schedule runs and the latest alerts - all within the caller''s visibility scope (server groups), cached for up to five seconds; an event (`server.status`, `job.finished`, `alert.fired`) invalidates the cache. `tiles` counts per traffic-light level (`excellent`, `green`, `yellow`, `red`); `incapable` additionally counts the servers whose package manager or connection has failed. `attention` lists red servers before yellow ones (at most 20) with the most important finding (`key` and `params` as under `/servers/statuses`). `recent_jobs` are the 15 most recently finished jobs without health checks. `upcoming` are the next 10 runs of the group schedules (without system schedules), calculated from the cron expressions. `recent_alerts` contains the latest 10 alerts only with the `alerts:manage` permission, otherwise an empty list.'
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  tiles:
                    type: object
                    properties:
                      excellent:
                        type: integer
                      green:
                        type: integer
                      yellow:
                        type: integer
                      red:
                        type: integer
                      incapable:
                        type: integer
                      total:
                        type: integer
                  attention:
                    type: array
                    items:
                      type: object
                      properties:
                        server_id:
                          type: integer
                        name:
                          type: string
                        level:
                          type: string
                          enum:
                          - red
                          - yellow
                        insight:
                          type: object
                          nullable: true
                          properties:
                            severity:
                              type: string
                              enum:
                              - info
                              - warning
                              - critical
                            key:
                              type: string
                            params:
                              type: object
                              additionalProperties:
                                type: string
                            message:
                              type: string
                  recent_jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        server_id:
                          type: integer
                          nullable: true
                        server_name:
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        started_at:
                          type: string
                          format: date-time
                          nullable: true
                        finished_at:
                          type: string
                          format: date-time
                          nullable: true
                        duration_seconds:
                          type: integer
                          nullable: true
                  upcoming:
                    type: array
