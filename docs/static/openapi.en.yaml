      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Package name or prefix pattern with trailing *.
                no_remove:
                  type: boolean
                  default: true
                hold:
                  type: boolean
                  default: false
                note:
                  type: string
                global:
                  type: boolean
                  description: true = applies to ALL servers.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
