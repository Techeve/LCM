        With `send_email`, the link is additionally sent to the address stored on the Linux user. It is returned in the response in EVERY case: if sending fails (`mailed: false`, `mail_error`), the administrator still has it at hand and can pass it on manually - the link is already valid.

        The text of the email depends on whether the account already has credentials: without any, it invites the recipient to set them up; with some, it talks about a reset. It is the same link - but an invitation for an account that someone has long been using looks like an attack attempt.

        Required permission: `linux-users:write`.
      parameters:
      - name: id
