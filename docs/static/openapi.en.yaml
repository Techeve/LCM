  /api/v1/servers:
    get:
      tags:
      - Servers
      summary: Server list with filters, sorting and paging.
      operationId: serverCtrl_List
      description: |-
        Filtered, sorted and paginated. Response: {items, total}; an entry is the server including groups plus status, insights, os_support, incapable and updates (overdue package updates).

        Required permission: `servers:read`.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Substring in name or host (case-insensitive).
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Exact server name (case-insensitive).
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated list of the traffic-light levels excellent, green, yellow, red.
      - name: incapable
        in: query
        required: false
        schema:
          type: string
        description: '"1" - only servers that LCM can no longer maintain.'
      - name: os
        in: query
        required: false
        schema:
          type: string
        description: Substring in OS name, version or identifier.
      - name: kernel
        in: query
        required: false
        schema:
          type: string
        description: Substring in the kernel version.
      - name: group_id
        in: query
        required: false
        schema:
          type: integer
        description: Only servers of this server group.
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated list of server identifiers.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - -name
          - status
          - -status
          - last_seen
          - -last_seen
          - os
          - -os
          - kernel
          - -kernel
          - updates
          - -updates
          default: name
        description: Sorting; status = worst state first, -status = best first.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size (default 100, maximum 1000).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Number of matches to skip.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: 'Success: {items, total}.'
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/servers/agent:
    post:
      tags:
      - Servers
      summary: Create an agent server (LCM Remote) and obtain an enrollment token.
      operationId: serverCtrl_CreateAgent
      description: |-
        Creates a server that connects OUTBOUND via MQTT using lcm-agent - for machines behind NAT or with a changing address that LCM cannot reach via SSH.

        The enrollment token is delivered ONCE in the response; only its hash is stored. It cannot be displayed again, only replaced (see /servers/{id}/agent-token). The server is initially offline and goes online as soon as the agent reports in.

        Required permission: `servers:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '201':
          description: Server created; token included once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    type: object
                  token:
                    type: string
                    description: Enrollment token - never shown again.
        '400':
          description: Name missing or invalid request body.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '409':
          description: A server with this name already exists.
