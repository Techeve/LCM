  /api/v1/servers/{id}/deep-scan/reports/{reportId}:
    get:
      tags:
      - Servers
      summary: A single, dated deep scan run including its findings.
      operationId: serverCtrl_DeepScanReportDetail
      description: |-
        Every deep scan is stored as its own report. This endpoint returns one of them in full - with `is_new` per finding (was not in the previous run yet) and `resolved_titles` (what has disappeared since). The list of runs is in `GET /servers/{id}/deep-scan` under `reports`.

        The report ID is checked against the server: a foreign ID returns 404, not the findings of another server.

        Required permission: `servers:read`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: reportId
        in: path
        required: true
        description: UUID of the run (from `reports[].id`).
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: The run including findings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  critical:
                    type: integer
                  warnings:
                    type: integer
                  infos:
                    type: integer
                  new_findings:
                    type: integer
                    description: Findings that were not present in the previous run (first run always 0).
                  resolved_findings:
                    type: integer
                  resolved_titles:
                    type: string
                    description: JSON array of the finding titles that have disappeared since the previous run.
                  hardening_index:
                    type: integer
                    nullable: true
                  tools:
                    type: string
                    description: Tools of this run, e.g. "needrestart,lynis".
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        category:
                          type: string
                          enum:
                          - kernel
                          - restart
                          - misconfig
                        severity:
                          type: string
                          enum:
                          - info
                          - warning
                          - critical
                        title:
                          type: string
                        detail:
                          type: string
                        tool:
                          type: string
                        is_new:
                          type: boolean
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: Run not found (or belongs to a different server).
