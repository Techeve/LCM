        not count), `unknown` (state cannot be retrieved) or `subscription`. The active
        channel is never locked. Required permission: `settings:manage`.'
      responses:
        '200':
          description: Installed version and state per channel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: string
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        channel:
                          type: string
                          enum: [community, beta, enterprise]
                        latest:
                          type: string
                        error:
                          type: string
                        lock:
                          type: string
                          enum: [behind, unknown, subscription]
        '401':
