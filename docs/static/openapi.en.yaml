      - Servers
      summary: Repairs the package manager (dpkg --configure -a or dependencies).
      operationId: serverCtrl_RepairPackages
      description: |-
        Repairs the package manager as a job. dpkg_configure completes interrupted dpkg installations (apt only), fix_deps pulls in missing dependencies (apt: apt-get -f install, zypper: zypper verify). The repair does not reset any operability category - only the success of the retried action does that.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - dpkg_configure
                  - fix_deps
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: string
                  job_name:
                    type: string
        '400':
          description: Unknown action or not supported for the server's package management.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: Server not found or outside the access scope.
        '409':
          description: The server is busy or not available for this device.
