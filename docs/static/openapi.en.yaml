  /api/v1/servers/{id}/actions/{action}/preview:
    get:
      tags:
      - Servers
      summary: Command preview of a server action - what the run would execute.
      operationId: serverCtrl_ActionPreview
      description: |-
        Shows what an action would execute on the server without triggering it: the commands (from the same code that runs them later; passwords, tokens and keys are replaced by ••••), the affected packages (from the stored package state, no SSH access), whether a reboot is needed, whether the action is reversible, and the approximate duration. No connection is established and no job is created.

        Actions (action): refresh, upgrade-all, upgrade-security, update, remove, autoremove, repair, kernels-cleanup, reboot, retry, snaps-refresh-all, snaps-refresh, snaps-remove, custom. They follow the paths of the actual endpoints (packages/upgrade-all, kernels/cleanup, snaps/refresh-all, …).

        The duration is an estimate from a base time plus time per affected package (one hour at most). reboot is no, maybe (libraries, system services) or yes (kernel, microcode, reboot action). notes are codes that the UI translates. Actions whose commands are only determined at execution time (for example the CVE reassessment on "Retry") respond with 409 server.preview_unavailable.

        Required permission: `servers:read` (for custom additionally `rules:manage`).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - refresh
          - upgrade-all
          - upgrade-security
          - update
          - remove
          - autoremove
          - repair
          - kernels-cleanup
          - reboot
          - retry
          - snaps-refresh-all
          - snaps-refresh
          - snaps-remove
          - custom
      - name: package
        in: query
        required: false
        description: Package or snap names, comma-separated (update, remove, snaps-refresh, snaps-remove).
        schema:
          type: string
      - name: version
        in: query
        required: false
        description: Exact version for exactly one package (update).
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: Kind of repair (repair).
        schema:
          type: string
          enum:
          - dpkg_configure
          - fix_deps
      - name: category
        in: query
        required: false
        description: Operability category (retry).
        schema:
          type: string
          enum:
          - connection
          - packages
          - rules
          - cve_scan
      - name: id
        in: query
        required: false
        description: ID of the custom action (custom).
        schema:
          type: integer
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        run:
                          type: string
                        as:
                          type: string
                          enum:
                          - root
                          - service_user
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        from:
                          type: string
                        to:
                          type: string
                  services:
                    type: array
                    items:
                      type: string
                  reboot:
                    type: string
                    enum:
                    - false
                    - maybe
                    - 'yes'
                  reversible:
                    type: boolean
                  duration:
                    type: object
                    properties:
                      min_seconds:
                        type: integer
                      max_seconds:
                        type: integer
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        params:
                          type: object
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: Server not found or outside the access scope, unknown action or unknown custom action.
        '409':
          description: The action is not possible on this server (RouterOS, DSM, restricted sudo, no old kernels, …) or its commands are not known beforehand.
        '422':
          description: Invalid package or snap names, protected package.
  /api/v1/servers/{id}/capabilities:
    get:
      tags:
      - Servers
      summary: Operational readiness of the server - always all four categories.
      operationId: serverCtrl_Capabilities
      description: |-
        Returns the operational readiness of the server: always four entries in the order connection, packages, rules, cve_scan, even without history. Each entry contains the stored state (state: ok or failed, failing_since, consecutive_failures, last_success_at, last_error_class, last_error_message, last_job_id, last_job_type, last_job_name, warning_class, warning_message) and computed fields: effective (critical, warning or empty), stale (packages only: stall of package updates, warning, critical or empty), repair (dpkg_configure, fix_deps or empty - the repair that matches the error class and package management of the server) and retryable (whether the failed action can be triggered again).

        Required permission: `servers:read`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: List of the four categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    server_id:
                      type: integer
                    category:
                      type: string
                      enum:
                      - connection
                      - packages
                      - rules
                      - cve_scan
                    state:
                      type: string
                      enum:
                      - ok
                      - failed
                    failing_since:
                      type: string
                      format: date-time
                      nullable: true
                    consecutive_failures:
                      type: integer
                    last_success_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_error_class:
                      type: string
                    last_error_message:
                      type: string
                    last_error_params:
                      type: object
                      additionalProperties:
                        type: string
                    last_job_id:
                      type: string
                    last_job_type:
                      type: string
                    last_job_name:
                      type: string
                    warning_class:
                      type: string
                    warning_message:
                      type: string
                    effective:
                      type: string
                      enum:
                      - ''
                      - critical
                      - warning
                    stale:
                      type: string
                      enum:
                      - ''
                      - critical
                      - warning
                    repair:
                      type: string
                      enum:
                      - ''
                      - dpkg_configure
                      - fix_deps
                    retryable:
                      type: boolean
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: Server not found or outside the access scope.
  /api/v1/servers/{id}/capabilities/{category}/retry:
    post:
      tags:
      - Servers
      summary: Triggers the failed action of a category again.
      operationId: serverCtrl_RetryCapability
      description: |-
        Re-triggers the failed action of the category and returns the started job. If the failure came from a rule, the same rule runs only for this server; otherwise the matching ad-hoc action (updates, security updates, package list, CVE scan). The category connection checks the connection. Only the success of this action resets the category.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: category
        in: path
        required: true
        schema:
          type: string
          enum:
          - connection
          - packages
          - rules
          - cve_scan
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: string
                  job_name:
                    type: string
        '400':
          description: Unknown category.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: Server not found or outside the access scope.
        '409':
          description: The category has not failed, the action cannot be triggered again, or the server is busy.
