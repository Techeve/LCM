  /api/v1/servers/{id}/dns:
    post:
      tags:
      - Servers
      summary: Set the server's nameservers (max. 3).
      operationId: serverCtrl_ConfigureDNS
      description: |-
        Sets up to three nameservers on the server. An EMPTY list releases DNS management again (LCM then no longer touches it).

        Runs SYNCHRONOUSLY and with rollback: if name resolution is broken after writing, LCM restores the previous configuration - an unreachable server would be the most expensive conceivable failed attempt.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                servers:
                  type: array
                  description: IP addresses of the nameservers; empty = release management.
                  items:
                    type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  output:
                    type: string
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '422':
          description: More than three nameservers or invalid IP.
        '502':
          description: Server not reachable.
