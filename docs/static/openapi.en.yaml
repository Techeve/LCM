      operationId: subCtrl_SetAptChannel
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      description: 'Starts a job on the self-registered LCM host. `enterprise`: credentials in apt auth.conf.d, dedicated enterprise source, channel separation, verification only against the new source with rollback on failure - requires an active subscription. `beta`: open beta source alongside the community source (no access needed). `community`: the way back, which never leaves you without a package source. The former field `enable` still applies as long as no `channel` is supplied (true = enterprise). Required permission: `settings:manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                  - community
                  - beta
                  - enterprise
                enable:
                  type: boolean
                  description: Deprecated - only evaluated if channel is missing.
      responses:
        '202':
          description: Job started (job object in the response).
        '400':
          description: Not possible (unknown channel, no active subscription, or no LCM host with apt).
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '409':
          description: A job is already running on the LCM host, or the target channel is behind the installed version in its major or feature number (`subscription.channel_behind`) or its state cannot be retrieved (`subscription.channel_unknown`).
