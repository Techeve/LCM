  /api/v1/events:
    get:
      tags:
      - Events
      summary: Event channel (WebSocket) - reports what changes in the background.
      operationId: eventHub_Connect
      security:
      - apiKeyAuth: []
      description: |-
        Upgrade to WebSocket. The browser cannot set a header and therefore fetches a ticket with `POST /events/ticket` before every connection attempt (one-time, 30 seconds, bound to user and session) and connects with `?ticket=...`; scripts connect with `X-API-Key` without a ticket. The API stays REST - the channel only reports THAT something has changed; the client fetches the details via REST. The origin check is mandatory: the host of the Origin header must match the host of the request or the public base address, otherwise 403. Without an Origin (no browser) only an API key is accepted. At most 20 connections per session (session ID or SHA-256 of the API key); the 21st is closed after the upgrade with code 4429. Every 60 seconds the sign-in is checked again; on sign-out, or a change of password, role or status, the server closes with code 4401.

        Client → Server (JSON, at most 4 KiB, at most 64 topics): `{"type":"subscribe","topics":[...]}` and `{"type":"unsubscribe","topics":[...]}`. Topics: `servers`, `server:<id>`, `jobs`, `job:<uuid>`, `alerts`, `bulk`, `system`, `dashboard`.

        Server → Client: `{"type":"hello","version","build"}` after connecting; `{"type":"subscribed","topics":[...]}` in response to subscribe/unsubscribe; `{"type":"event","event":"server.busy|server.status|job.progress|job.finished|alert.fired|bulk.progress|system.build","topic":"...","data":{...}}`; `{"type":"resync"}` if events were lost (reload everything); `{"type":"ping"}` every 30 seconds (in addition to the WebSocket ping); `{"type":"error","code","error","topic"}` for invalid messages.

        Every event is filtered by the user's permissions and server groups.
      responses:
        '101':
          description: Connection established.
        '401':
          description: Not signed in.
        '403':
          description: Origin not allowed.
  /api/v1/events/ticket:
    post:
      tags:
      - Events
      summary: Issues the one-time ticket for the event channel.
      operationId: eventHub_Ticket
      description: Only with a browser session (X-LCM-Session or cookie); with an API key 400 `events.ticket_needs_session`, because scripts connect directly with `X-API-Key`. The response contains `ticket` and `expires_in_seconds` (30). The ticket is valid once, for the user and session that fetched it.
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Successful.
        '400':
          description: Only with a browser session.
        '401':
          description: Not signed in.
