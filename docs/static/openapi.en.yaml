      operationId: serverCtrl_ConfigureNTP
      description: Enters the time servers (chrony, systemd-timesyncd or ntpd -- whichever is present), starts the service and PROVES the synchronization. Existing server/pool lines are replaced, the rest of the file stays, a .lcm-bak backup is created. If the proof does not arrive within the time window, the call ends with 502 and a message that says exactly that -- the configuration remains in place. Required permission -- servers:write.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                servers:
                  type: array
                  maxItems: 4
                  items:
                    type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Time server set, synchronization verified.
        '400':
          description: Invalid time server or more than four.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '409':
          description: Container -- the clock comes from the host and cannot be set here.
        '502':
          description: Time servers entered, but synchronization could not be verified.
