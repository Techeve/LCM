    post:
      tags:
      - Servers
      summary: Body {enable:bool, rules:[{port,proto,ip_version,allowlist_ids,source_ips,comment}], ssh_sources:{allowlist_ids,source_ips}, ports:"80,443"}.
      operationId: serverCtrl_ConfigureFirewall
      description: |-
        Body {enable:bool, rules:[{port,proto,ip_version,allowlist_ids,source_ips,comment}], ssh_sources:{allowlist_ids,source_ips}, ports:"80,443"}. enable=false disables the firewall; rules are the detailed allowances (proto tcp|udp, ip_version any|v4|v6, allowlist_ids = IDs of named IP allowlists, source_ips = manual source IPs/CIDRs - both together restrict the allowance to these sources as a union; with neither it applies to all sources; comment = free-form note, ends up in the ruleset on the target system for ufw/nftables), ports is the legacy CSV way (TCP only). Asynchronous job - depending on the distribution, the firewall tool (ufw/firewalld/nftables) is installed first; response 202 {status, job_id, job_name}.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job started ({status, job_id, job_name}).
        '400':
          description: Invalid rules.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
