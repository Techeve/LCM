      description: |-
        Creates a pin. A pin protects a package from cleanup (autoremove) and from targeted removal (no_remove) and/or freezes its version (hold). A trailing `*` in the name acts as a prefix pattern (`linux-image-*`). If the same name already exists in the same scope, its effects are updated.

