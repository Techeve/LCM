    post:
      tags:
      - Servers
      summary: Check which http sources speak HTTPS before switching.
      operationId: serverCtrl_CheckRepositoriesHTTPS
      description: |-
        Fetches the Release file of every unencrypted apt source over https from the server itself (apt-helper, without root, all sources at once with a short deadline). One result per source: ok, no_https (HTTPS fails) or unknown (could not be checked). For sources without HTTPS, alternative names a mirror of the same distribution that speaks HTTPS, if LCM knows one. LCM remembers the sources without HTTPS on the server (https_unavailable_urls). Synchronous.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        uri:
                          type: string
                          description: The source in its http form.
                        state:
                          type: string
                          enum:
                          - ok
                          - no_https
                          - unknown
                        alternative:
                          type: string
                          description: Recommended mirror with HTTPS; missing if LCM knows none.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '504':
          description: The server did not finish the check in time.
