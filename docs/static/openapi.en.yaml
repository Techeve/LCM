  /api/v1/servers/{id}/terminal/ticket:
    post:
      tags:
      - Servers
      summary: Issues a one-time ticket for the web console.
      operationId: terminalCtrl_Ticket
      description: |-
        Returns a one-time ticket valid for thirty seconds, which is then used to establish the WebSocket connection to the console.

        Why the detour: the browser's WebSocket interface cannot set custom headers, so the sign-in token would not arrive there. Appending it to the URL is out of the question - URLs end up in access and proxy logs, and this access opens a root shell. The ticket is valid once, briefly, and only for this one server; if it later appears in a log, it is long worthless.

        Required permission: `servers:console` - deliberately NOT included in `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Ticket issued.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/servers/{id}/terminal:
    get:
      tags:
      - Servers
      summary: Opens the interactive console (WebSocket).
      operationId: terminalCtrl_Connect
      description: |-
        Establishes the console connection. Proof is the ticket from `POST /terminal/ticket` (`?ticket=…`), not the sign-in token - the endpoint therefore carries no permission check.

        Keystrokes travel over the connection as binary messages; a resize is sent as the text message `{"type":"resize","cols":…,"rows":…}` so that it does not end up as input in the terminal. The output comes back as binary.

        The session is RECORDED and afterwards appears in the SSH log. It occupies the server's execution slot: while the console is open, no schedules run there. After 15 minutes without input it ends by itself.

        Not possible on demo servers, Synology DSM, agent servers (the transport carries no stream) and servers in maintenance.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: ticket
        in: query
        required: true
        schema:
          type: string
      - name: cols
        in: query
        schema:
          type: integer
      - name: rows
        in: query
        schema:
          type: integer
      security: []
      responses:
        '101':
          description: Connection established.
        '400':
          description: No console is possible on this server.
        '401':
          description: Invalid or expired ticket.
        '403':
          description: The web console is disabled.
        '409':
          description: Something else is currently running on the server.
  /api/v1/system/logs:
    get:
      tags:
      - System
      summary: Returns the end of the LCM log.
      operationId: logsCtrl_List
      description: |-
        The service's own log, most recent line last. `lines` limits the amount (default 300, maximum 2000), `level` filters by severity (debug/info/warn/error), `q` by text fragment in the whole line.

        Required permission: `settings:manage` - the log contains names, addresses and commands of ALL servers.
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: No file log configured.
  /api/v1/system/logs/stream:
    get:
      tags:
      - System
      summary: Streams new log lines as Server-Sent Events.
      operationId: logsCtrl_Stream
      description: |-
        Delivers every new line from the current end of the file as the SSE event `log`; in between, `ping` as a heartbeat. The same filters as for the list (`level`, `q`). The stream ends after 30 minutes - the browser reconnects it automatically.

        Note for clients: Authentication runs via a header (`X-LCM-Session` or `X-API-Key`), which `EventSource` cannot set. The stream must therefore be read via `fetch`; the session value does NOT belong in the URL (it would otherwise end up in access and proxy logs).

        Required permission: `settings:manage`.
      responses:
        '200':
          description: Event stream.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '404':
          description: No file log configured.
  /api/v1/system/logs/level:
    get:
      tags:
      - System
      summary: Returns the effective log level.
      operationId: logsCtrl_Level
      description: |-
        The currently effective level and - if a time-limited debug is running - the point in time at which it ends.

        Required permission: `settings:manage`.
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
    post:
      tags:
      - System
      summary: Switches the time-limited debug log on or off.
      operationId: logsCtrl_SetLevel
      description: |-
        `{"debug": true}` raises the level to debug for 30 minutes and then restores it automatically; `{"debug": false}` ends it immediately. The time limit is intentional: debug logs every SSH command including its output, and a permanently enabled debug fills the log file on a small machine faster than rotation can clear it away.

        Required permission: `settings:manage`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                debug:
                  type: boolean
      responses:
        '200':
          description: Successful.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
