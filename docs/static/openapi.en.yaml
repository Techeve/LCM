  /api/v1/security/scanner:
    get:
      tags:
      - Security (global)
      summary: State of the CVE scanner (version + vulnerability database).
      operationId: opsCtrl_ScannerStatus
      description: |-
        Returns the version of the scanner (Trivy) and the state of its vulnerability database, including a freshness rating.

        Why this is a separate endpoint: Trivy downloads the database itself during the scan - but only with network access. If that fails (air-gapped host, proxy, registry rate limit), Trivy WARNS and keeps scanning with the old database. The result is then not an error but "no vulnerabilities found": a three-week-old database looks like a clean server. Only the timestamp tells the two apart.

        The reference for freshness is updated_at (when the vendor built the database), NOT downloaded_at - anyone who fetches the same old database anew every day still has old data. Thresholds: "stale" from 48 hours, "critical" from 7 days.

        Required permission: `packages:read`.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Scanner and database status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Is the scanner binary present?
                  version:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
                    description: When the vendor built this database (authoritative).
                  next_update:
                    type: string
                    format: date-time
                  downloaded_at:
                    type: string
                    format: date-time
                    description: When this host fetched them - for diagnostics only.
                  freshness:
                    type: string
                    enum:
                    - fresh
                    - stale
                    - critical
                    - unknown
                  age_hours:
                    type: integer
                  error:
                    type: string
                    description: Why the status could not be determined (e.g. never loaded).
        '401':
          description: Not signed in.
        '403':
          description: No permission.
  /api/v1/security/scanner/update-db:
    post:
      tags:
      - Security (global)
      summary: Reload the vulnerability database.
      operationId: opsCtrl_UpdateCVEDB
      description: |-
        Fetches a newer version of the vulnerability database in the background, without scanning. Asynchronous job (202 {status, job_id, job_name}) - so that a failure, including the tool's output, ends up in the log instead of silently fizzling out. That is also exactly where the cause is found (no network, proxy, registry rate limit).

        The job is not attached to any server: scanner and database live centrally on the LCM host.

        Required permission: `settings:manage`.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job started.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '409':
          description: The CVE scanner is not installed on the LCM host.
