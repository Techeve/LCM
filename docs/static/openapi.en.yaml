  /api/v1/servers/{id}/security-tool:
    post:
      tags:
      - Servers
      summary: Install and set up fail2ban or CrowdSec.
      operationId: serverCtrl_ConfigureSecurityTool
      description: |-
        Installs and configures brute-force protection on the server. Asynchronous job (202 {status, job_id, job_name}).

        Lockout protection: The IP that LCM is currently using to reach the server always ends up in the allowlist (`ignoreip` for fail2ban, parser whitelist for CrowdSec) - together with loopback and the sources given here. The source IP is read without `sudo` (`$SSH_CONNECTION`) because `sudo` discards this variable.

        If a referenced allowlist cannot be resolved, LCM does NOT abort the protection, but appends a visible `LCM-WARNUNG` to the job output - nobody should assume protection that does not exist.

        The setup interferes with services and system configuration; in restricted mode (sudo whitelist) it runs through the LCM helper. For operating an already installed tool, see /security-tool/manage.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool
              properties:
                tool:
                  type: string
                  enum:
                  - fail2ban
                  - crowdsec
                allowlist_ips:
                  type: array
                  description: Additional sources that are never blocked - IP or CIDR.
                  items:
                    type: string
                allowlist_ids:
                  type: array
                  description: IDs of named IP allowlists; their entries are added.
                  items:
                    type: integer
                bouncer:
                  type: boolean
                  default: true
                  description: 'CrowdSec only - also install the firewall bouncer (it is what enforces the bans). If the field is missing, true applies: without a bouncer, CrowdSec detects but blocks nothing.'
                  example: true
                collections:
                  type: array
                  description: CrowdSec only - collections to install. Empty = crowdsecurity/sshd.
                  items:
                    type: string
                lapi_mode:
                  type: string
                  description: CrowdSec only - LAPI connection. local = standalone on this server (default); remote/console require credentials stored under Settings.
                  enum:
                  - local
                  - remote
                  - console
                  default: local
                lapi_id:
                  type: integer
                  description: CrowdSec in remote mode only - the selected LAPI (Settings → CrowdSec). If the field is missing, the only LAPI applies if there is exactly one.
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '202':
          description: Job started.
        '400':
          description: Unknown tool, invalid allowlist IP, invalid collection name or LAPI mode, or the selected remote/console mode is not configured.
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '409':
          description: RouterOS device, or CrowdSec is not available on this distribution (pacman).
  /api/v1/servers/{id}/security-tool/bans:
    get:
      tags:
      - Servers
      summary: Current blocklist of an installed security tool.
      operationId: serverCtrl_SecurityToolBans
      description: |-
        Returns the currently banned IP addresses of fail2ban or CrowdSec, unified across both tools. Deliberately SYNCHRONOUS (no job): job polling would be inappropriate for a pure query, and anyone who has locked themselves out wants to see the list immediately. Demo servers return an empty list (no SSH contact).

        Required permission: `servers:read`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tool
        in: query
        required: true
        description: fail2ban | crowdsec
        schema:
          type: string
          enum:
          - fail2ban
          - crowdsec
      security:
      - sessionAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Ban list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bans:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                        scope:
                          type: string
                          description: 'fail2ban: jail - CrowdSec: scenario.'
                        since:
                          type: string
                          description: 'CrowdSec: remaining duration.'
                        cause:
                          type: string
                          description: 'CrowdSec: origin of the decision.'
                        tool:
                          type: string
        '401':
          description: Not signed in.
        '403':
          description: No permission.
        '422':
          description: Unknown tool or unsupported server.
  /api/v1/servers/{id}/security-tool/manage:
