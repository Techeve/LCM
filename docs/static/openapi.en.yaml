                    type: object
                    description: 'Running kernel (uname -r) and installed kernel packages. Only comparing both tells anything: after a kernel update the new one is installed, but does not run until a restart.'
                    properties:
                      running:
                        type: string
                        description: Output of uname -r - the kernel actually booted.
                      installed:
                        type: array
                        description: Installed kernel packages, newest first. EMPTY in containers (see managed).
