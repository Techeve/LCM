    post:
      tags:
      - Servers
      summary: Trigger deep scan (kernel reboot gap, kernel CVEs, hardening audit).
      operationId: opsCtrl_DeepScanServer
      description: |-
        Triggers the deep scan on the server: open kernel reboot gap (needrestart), kernel-related CVEs and a hardening/misconfiguration audit (Lynis, otherwise LCM's own checks).

        Runs asynchronously via the scheduler and therefore returns NO job ID: completion can be recognized by the changed timestamp of the report (GET). The scan is read-only and also runs in restricted sudo mode.

        Required permission: `servers:write`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
